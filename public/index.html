<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2ee" />
  <title>AI Assistant for your website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
  <style>
    :root { --olive: #556b2f; --olive-soft: #8a9a5b; --black: #141512; --gray: #f2f2ee; --gray-dot: #c9cbc2; }
    html, body { margin: 0; height: 100%; }
    main { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
    body {
      background: var(--gray); color: var(--black);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    /* Soft olive glow behind the headline. */
    body::before {
      content: ""; position: fixed; left: 50%; top: 50%; width: min(900px, 120vw); aspect-ratio: 1;
      transform: translate(-50%, -50%); z-index: -2; border-radius: 50%;
      background: radial-gradient(circle, rgba(85,107,47,.16) 0%, rgba(85,107,47,0) 62%);
    }
    /* Dotted grid that fades out from the center. */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background-image: radial-gradient(var(--gray-dot) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse 55% 45% at 50% 50%, #000 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 55% 45% at 50% 50%, #000 0%, transparent 100%);
    }
    h1 { margin: 0; line-height: 1; animation: rise .9s cubic-bezier(.2,.9,.3,1) both; }
    .line1 {
      display: block; font-size: clamp(48px, 11vw, 120px); font-weight: 800; letter-spacing: -.055em;
      color: var(--black);
    }
    .line2 {
      display: block; margin-top: .06em; font-size: clamp(44px, 10vw, 112px);
      font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.02em;
      color: var(--olive);
    }
    .line2 .mark { position: relative; white-space: nowrap; }
    .line2 .mark svg {
      position: absolute; left: -2%; bottom: -.12em; width: 104%; height: .32em; overflow: visible;
    }
    .line2 .mark path {
      fill: none; stroke: var(--olive-soft); stroke-width: 6; stroke-linecap: round; opacity: .55;
      stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.1s .7s cubic-bezier(.6,0,.2,1) forwards;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      h1, .line2 .mark path { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <span class="line1">AI Assistant</span>
      <span class="line2">for your <span class="mark">website<svg viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true"><path d="M4 14 C 70 4, 160 4, 296 10" /></svg></span></span>
    </h1>
  </main>
  <script src="widget.js" data-title="AI Assistant" defer></script>
</body>
</html>
